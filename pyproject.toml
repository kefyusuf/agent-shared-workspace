[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-shared-workspace"
version = "0.8.0"
description = "Local, provider-independent agent workspace with permissioned context handoff and a handshake-era MCP stdio adapter (M3.2 prototype)"
requires-python = ">=3.11"
license = {text = "UNLICENSED - prototype, not yet assigned an open-source license"}

[tool.setuptools.packages.find]
where = ["src"]
